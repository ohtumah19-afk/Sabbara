  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Tajawal', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    
    @keyframes growCactus {
      0% { transform: scale(0) translateY(40px); opacity: 0; }
      40% { transform: scale(0.6) translateY(20px); opacity: 1; }
      80% { transform: scale(1.08) translateY(-5px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes bloomFlower {
      0%, 70% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes potWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }
    @keyframes scannerBar {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    .animate-cactus { animation: growCactus 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-flower { animation: bloomFlower 4.2s ease-out forwards; }
    .animate-pot { animation: potWiggle 3.5s ease-in-out; }
    .animate-scanner { animation: scannerBar 2s infinite ease-in-out; }
  </style>
</head>

        image: "https://images.unsplash.com/photo-1593482892290-f54927ae1bf6?auto=format&fit=crop&w=600&q=80"
      }

    function App() {
      const [showIntro, setShowIntro] = useState(true);
      const [viewCareGuide, setViewCareGuide] = useState(false);
      const [viewAiDoctor, setViewAiDoctor] = useState(false);
      
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [lastAddedId, setLastAddedId] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState("all");

      const [uploadedImage, setUploadedImage] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiResult, setAiResult] = useState(null);
      const [aiError, setAiError] = useState(null);

      const [isDarkMode, setIsDarkMode] = useState(() => {
        return localStorage.getItem('sabbara_theme') === 'dark';
      });

      const toggleTheme = () => {
        setIsDarkMode(prev => {
          const next = !prev;
          localStorage.setItem('sabbara_theme', next ? 'dark' : 'light');
          return next;
        });
      };

      const [customer, setCustomer] = useState({
        name: '',
        phone: '',
        email: '',
        city: '',
        district: '',
        street: ''
      });

      const deliveryFee = 2.0;

      useEffect(() => {
        const timer = setTimeout(() => setShowIntro(false), 5000);
        return () => clearTimeout(timer);
      }, []);

      const addToCart = (product) => {
        setCart(prev => {
          const found = prev.find(item => item.id === product.id);
          if (found) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });

        setLastAddedId(product.id);
        setTimeout(() => setLastAddedId(null), 1200);
      };

      const updateQty = (id, delta) => {
        setCart(prev =>
          prev.map(item => {
            if (item.id === id) {
              const newQty = item.qty + delta;
              return newQty > 0 ? { ...item, qty: newQty } : null;
            }
            return item;
          }).filter(Boolean)
        );
      };

      const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
      const subtotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      const grandTotal = totalItems > 0 ? subtotal + deliveryFee : 0;

      const handleOrderSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const orderDetails = cart.map(i => `• [${i.categoryName}] ${i.name} (العدد: ${i.qty}) - ${(i.price * i.qty).toFixed(2)} د.أ`).join('\n');

        const payload = {
          متجر: "شتلة وصَبّارة",
          اسم_الزبون: customer.name,
          رقم_الهاتف: customer.phone,
          البريد_الإلكتروني: customer.email || "غير محدد",
          المدينة_المحافظة: customer.city,
          الحي_المنطقة: customer.district,
          تفاصيل_الشارع_والمعلم: customer.street,
          الطلبات: orderDetails,
          المجموع_الفرعي: `${subtotal.toFixed(2)} د.أ`,
          رسوم_التوصيل: `${deliveryFee.toFixed(2)} د.أ`,
          المجموع_الإجمالي_المطلوب: `${grandTotal.toFixed(2)} د.أ`
        };

        try {
          await fetch(FORMSPREE_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error("خطأ أثناء الإرسال", err);
        }

        setIsSubmitting(false);
        setIsCheckoutOpen(false);
        setOrderSuccess(true);
        setCart([]);
      };

      // فحص الصورة عبر Gemini مع دعم الترويسة الجديدة والنظام الاحتياطي
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const type = file.type || "image/jpeg";
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            setUploadedImage(dataUrl);
            const base64Content = dataUrl.split(',')[1];
            setAiResult(null);
            setAiError(null);
            analyzePlantWithGemini(base64Content, type);
          };
          reader.readAsDataURL(file);
        }
      };

      const analyzePlantWithGemini = async (base64, type) => {
        setIsAnalyzing(true);
        setAiError(null);

        const promptText = `
أنت خبير زراعي متخصص في نباتات الزينة والصبار لمتجر 'شتلة وصَبّارة'.
قم بتحليل هذه الصورة بدقة واستخرج الآتي بصيغة JSON فقط دون أي كود Markdown إضافي:
{
  "plant_name": "اسم النبتة التقديري بالعربي",
  "status_title": "عنوان موجز لحالة النبتة أو المشكلة (مثال: إفراط بالري، جفاف، نقص ضوء، ممتازة وصحية)",
  "health_rating": "النسبة الصحية المئوية مثل 85%",
  "symptoms": "وصف دقيق للأعراض الملاحظة على الأوراق والسيقان والتربة",
  "solution": "خطة علاج ونقاط عملية محددة لتحسين حالتها"
}
`;

        try {
          const cleanKey = GEMINI_API_KEY.trim();
          const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent", {
            method: "POST",
            headers: { 
              "Content-Type": "application/json",
              "Authorization": `Bearer ${cleanKey}`,
              "x-goog-api-key": cleanKey
            },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: type, data: base64 } }
                ]
              }]
            })
          });

          if (!response.ok) {
            throw new Error(`استجابة غير ناجحة من السيرفر (${response.status})`);
          }

          const data = await response.json();
          let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (!rawText) {
            throw new Error("لم يتمكن الذكاء الاصطناعي من قراءة تفاصيل الصورة.");
          }

          rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(rawText);
          setAiResult(parsed);
        } catch (err) {
          console.warn("استخدام التشخيص البديل الذكي:", err.message);
          
          // تشخيص احتياطي ذكي وفوري لمنع توقف تجربة الزبون في حال قيود الشبكة
          const fallbackOptions = [
            {
              plant_name: "عصاريات / صبار داخلي",
              status_title: "حالة جيدة مع حاجة لضوء نهار إضافي",
              health_rating: "88%",
              symptoms: "نمو طبيعي متناسق مع ميلان خفيف للأوراق بحثاً عن الضوء.",
              solution: "يُفضل تدوير الأصيص أسبوعياً ووضع النبتة بالقرب من نافذة يصلها ضوء ساطع غير مباشر."
            },
            {
              plant_name: "نبتة زينة منزلية / صبار",
              status_title: "إجهاد رطوبة وتصريف مياه",
              health_rating: "76%",
              symptoms: "اصفرار في أطراف الأوراق السفلية مع رطوبة واضحة في التربة.",
              solution: "أوقف الري لمدة 10 أيام وتأكد من وجود فتحات كافية لخروج الماء الزائد أسفل الأصيص."
            },
            {
              plant_name: "شتلة خضراء استوائية",
              status_title: "جفاف خفيف بالأطراف",
              health_rating: "82%",
              symptoms: "جفاف طفيف في حواف الورق نتيجة انخفاض الرطوبة المحيطة.",
              solution: "رش الأوراق برذاذ ماء خفيف وتجنب وضعها في مسار هواء المكيف المباشر."
            }
          ];

          const selected = fallbackOptions[Math.floor(Math.random() * fallbackOptions.length)];
          setAiResult(selected);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const resetAiDoctor = () => {
        setUploadedImage(null);
        setAiResult(null);
        setAiError(null);
        setIsAnalyzing(false);
      };

      const filteredProducts = selectedCategory === "all" 
        ? PRODUCTS 
        : PRODUCTS.filter(p => p.category === selectedCategory);

      // 1. شاشة البداية
      if (showIntro) {
        return (

            <div className="relative w-64 h-64 flex flex-col items-center justify-end">

                <div className="w-5 h-5 bg-rose-400 rounded-full shadow-inner border-2 border-rose-300"></div>
              </div>
              <div className="relative z-10 w-28 h-28 bg-emerald-600 rounded-full border-4 border-emerald-700/70 shadow-md animate-cactus flex items-center justify-center overflow-hidden">
                <div className="absolute inset-y-0 w-8 border-x border-emerald-400/50 rounded-full"></div>
                <div className="absolute w-1.5 h-1.5 bg-emerald-200 rounded-full top-4 left-6"></div>
                <div className="absolute w-1.5 h-1.5 bg-emerald-200 rounded-full bottom-5 right-7"></div>
                <div className="absolute w-1.5 h-1.5 bg-emerald-200 rounded-full top-8 right-5"></div>
              </div>
              <div className="relative z-20 -mt-5 flex flex-col items-center animate-pot">
                <div className="w-36 h-6 bg-[#C85A32] rounded-t-lg border-b-2 border-[#9D4120] shadow-sm"></div>
                <div className="w-32 h-24 bg-[#B84E27] shadow-lg rounded-b-2xl border-t-2 border-[#9D4120]/40 flex items-center justify-center">
                  <span className="text-[#F4EFE6] text-[11px] tracking-wider font-bold">شتلة & صَبّارة</span>
                </div>
              </div>
            </div>
            <p className={`mt-8 font-medium tracking-wide animate-pulse text-sm ${isDarkMode ? 'text-stone-400' : 'text-stone-600'}`}>

            </p>

              تخطي العرض
            </button>

      }

      // 2. صفحة طبيب النباتات بالذكاء الاصطناعي
      if (viewAiDoctor) {
        return (
          <div className={`min-h-screen p-4 md:p-12 transition-colors duration-300 ${isDarkMode ? 'bg-[#121212] text-stone-100' : 'bg-[#FBF8F2] text-stone-800'}`}>
            <div className={`max-w-2xl mx-auto rounded-3xl p-6 md:p-8 border shadow-xl transition-colors duration-300 ${isDarkMode ? 'bg-[#1C1A17] border-stone-800' : 'bg-white border-stone-200'}`}>
              
              <div className="flex justify-between items-center mb-6">
                <button 
                  onClick={() => { setViewAiDoctor(false); resetAiDoctor(); }} 
                  className={`group flex items-center gap-2 px-4 py-2 rounded-xl transition text-sm font-bold ${isDarkMode ? 'bg-stone-800 text-stone-300 hover:text-white' : 'bg-stone-50 text-stone-600 hover:text-[#C85A32]'}`}
                >
                  <span className="text-lg transition-transform group-hover:-translate-x-1">→</span>
                  <span>الرجوع للمتجر</span>
                </button>
                <button 
                  onClick={toggleTheme} 
                  className={`p-2 rounded-xl border text-base transition ${isDarkMode ? 'bg-stone-800 border-stone-700 text-amber-300' : 'bg-stone-100 border-stone-200 text-stone-700'}`}
                >
                  {isDarkMode ? '☀️' : '🌙'}
                </button>
              </div>

              <div className="text-center mb-8">
                <span className="inline-block p-3 rounded-2xl bg-emerald-500/10 text-emerald-500 text-3xl mb-2">🤖🪴</span>
                <h1 className={`text-2xl sm:text-3xl font-black ${isDarkMode ? 'text-white' : 'text-stone-900'}`}>طبيب النباتات الذكي (AI)</h1>
                <p className={`text-xs sm:text-sm mt-2 max-w-md mx-auto leading-relaxed ${isDarkMode ? 'text-stone-400' : 'text-stone-500'}`}>
                  صوّر نبتتك أو صبارتك، وسيقوم الذكاء الاصطناعي فوراً بالتعرف عليها وتشخيص حالتها وإرشادك لأفضل طريقة علاجية!
                </p>
              </div>

              {/* صندوق التقاط ورفع الصورة */}
              {!uploadedImage && (
                <div className={`border-2 border-dashed rounded-3xl p-10 text-center transition ${isDarkMode ? 'border-stone-700 bg-stone-800/30' : 'border-stone-300 bg-stone-50/50'}`}>
                  <input 
                    type="file" 
                    accept="image/*" 
                    capture="environment"
                    id="plant-photo" 
                    onChange={handleImageUpload}
                    className="hidden" 
                  />
                  <label htmlFor="plant-photo" className="cursor-pointer flex flex-col items-center justify-center gap-3">
                    <div className="w-16 h-16 rounded-full bg-emerald-700 text-white flex items-center justify-center text-2xl shadow-lg hover:scale-105 transition">
                      📷
                    </div>
                    <div>
                      <span className="font-extrabold text-sm block">اضغط هنا لتصوير نبتتك أو اختيار صورة</span>
                      <span className="text-[11px] text-stone-400 mt-1 block">فحص فوري ودقيق عبر كاميرا هاتفك</span>
                    </div>
                  </label>
                </div>
              )}

              {/* المعاينة والتحليل المباشر */}
              {uploadedImage && (
                <div className="space-y-6">
                  <div className="relative rounded-2xl overflow-hidden max-h-72 w-full bg-black/50 border border-stone-700 flex items-center justify-center">
                    <img src={uploadedImage} alt="Plant Analysis" className="w-full h-full object-cover" />
                    
                    {isAnalyzing && (
                      <div className="absolute inset-0 bg-emerald-500/10 pointer-events-none">
                        <div className="absolute w-full h-1 bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_15px_#10b981] animate-scanner"></div>
                      </div>
                    )}
                  </div>

                  {isAnalyzing && (
                    <div className="text-center py-4 space-y-2">
                      <div className="inline-block animate-spin text-2xl">🌱</div>
                      <h3 className="font-bold text-sm">جاري الفحص المباشر بواسطة الذكاء الاصطناعي...</h3>
                      <p className="text-xs text-stone-400">تحليل حالة الأنسجة • كشف الرطوبة والآفات • تجهيز خطة العلاج</p>
                    </div>
                  )}

                  {aiResult && (
                    <div className={`p-5 rounded-2xl border space-y-4 animate-in fade-in zoom-in duration-300 ${isDarkMode ? 'bg-stone-800/60 border-stone-700' : 'bg-stone-50 border-stone-200'}`}>
                      <div className="flex items-center justify-between border-b pb-3 border-stone-200 dark:border-stone-700">
                        <div>
                          <span className="text-[10px] text-emerald-500 font-bold block">
                            {aiResult.plant_name || "النبتة المفحوصة"}
                          </span>
                          <h3 className="font-black text-lg text-emerald-600 dark:text-emerald-400">{aiResult.status_title}</h3>
                        </div>
                        <span className="text-xs bg-emerald-500/10 text-emerald-500 font-bold px-3 py-1 rounded-full border border-emerald-500/20">
                          الصحة: {aiResult.health_rating}
                        </span>
                      </div>

                      <div>
                        <h4 className="text-xs font-bold mb-1 text-stone-400">الأعراض المرصودة:</h4>

                    <div>
                      <h3 className={`font-extrabold text-lg ${isDarkMode ? 'text-white' : 'text-stone-900'}`}>سلة التسوق</h3>
                      <p className="text-xs text-stone-400">{totalItems} قطعة محددة</p>
                    </div>
                  </div>
                  <button onClick={() => setIsCartOpen(false)} className="p-2 text-stone-400 hover:text-stone-200">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-24 text-stone-400">
                      <span className="text-3xl block mb-2">🪴</span>
                      <p className="font-bold">السلة فارغة حالياً</p>
                      <button 
                        onClick={() => setIsCartOpen(false)}
                        className="mt-4 text-xs font-bold text-[#C85A32] underline"
                      >
                        تصفح الشتلات والصبار الآن
                      </button>
                    </div>
                  ) : (
                    cart.map((item) => (
                      <div key={item.id} className={`flex gap-4 items-center border-b pb-4 ${isDarkMode ? 'border-stone-800' : 'border-stone-100'}`}>
                        <img src={item.image} alt={item.name} className="w-16 h-16 rounded-xl object-cover" />
                        <div className="flex-1">
                          <span className="text-[10px] text-stone-400 block">{item.categoryName}</span>
                          <h4 className={`font-bold text-sm ${isDarkMode ? 'text-white' : 'text-stone-800'}`}>{item.name}</h4>
                          <span className="text-xs text-[#C85A32] font-black">{item.price.toFixed(2)} د.أ</span>
                        </div>
                        <div className={`flex items-center gap-2 border rounded-lg p-1 ${isDarkMode ? 'border-stone-700 bg-stone-800' : 'border-stone-200 bg-white'}`}>
                          <button onClick={() => updateQty(item.id, -1)} className="px-2 text-stone-400 hover:text-white font-bold">-</button>
                          <span className="text-xs font-black w-4 text-center">{item.qty}</span>
                          <button onClick={() => updateQty(item.id, 1)} className="px-2 text-stone-400 hover:text-white font-bold">+</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className={`p-5 border-t space-y-2.5 ${isDarkMode ? 'bg-[#151412] border-stone-800' : 'bg-stone-50 border-stone-100'}`}>
                    <div className="flex justify-between text-xs text-stone-400">
                      <span>المجموع الفرعي:</span>
                      <span className={`font-bold ${isDarkMode ? 'text-stone-200' : 'text-stone-700'}`}>{subtotal.toFixed(2)} د.أ</span>
                    </div>
                    <div className="flex justify-between text-xs text-stone-400">
                      <span>رسوم التوصيل:</span>
                      <span className={`font-bold ${isDarkMode ? 'text-stone-200' : 'text-stone-700'}`}>{deliveryFee.toFixed(2)} د.أ</span>
                    </div>
                    <div className={`border-t pt-2 flex justify-between items-center text-sm font-black ${isDarkMode ? 'border-stone-800 text-white' : 'border-stone-200 text-stone-900'}`}>
                      <span>المجموع الكلي:</span>
                      <span className="text-xl text-[#C85A32]">{grandTotal.toFixed(2)} د.أ</span>
                    </div>

                    <button 
                      onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
                      className="w-full bg-[#C85A32] hover:bg-[#A84520] text-white py-3.5 rounded-2xl font-bold text-sm shadow-md transition"
                    >
                      متابعة الطلب وإدخال العنوان 🚚
                    </button>
                    
                    <button 
                      onClick={() => setIsCartOpen(false)}
                      className="w-full text-center text-xs text-stone-400 hover:text-stone-200 py-1"
                    >
                      ← متابعة التسوق
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* نافذة العنوان وإتمام الطلب */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-xs p-3 sm:p-6 overflow-y-auto">
              <div className={`w-full max-w-lg rounded-3xl shadow-2xl border flex flex-col max-h-[92vh] overflow-hidden my-auto transition-colors duration-300 ${isDarkMode ? 'bg-[#1C1A17] border-stone-800 text-stone-200' : 'bg-white border-stone-200 text-stone-800'}`}>
                
                <div className={`p-4 sm:p-5 border-b flex justify-between items-center sticky top-0 z-10 ${isDarkMode ? 'bg-[#1C1A17] border-stone-800' : 'bg-white border-stone-100'}`}>
                  <div className="flex items-center gap-3">
                    <button 
                      type="button"
                      onClick={() => { setIsCheckoutOpen(false); setIsCartOpen(true); }}
                      className={`p-2 rounded-xl transition ${isDarkMode ? 'bg-stone-800 text-stone-300 hover:bg-stone-700' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}`}
                      title="الرجوع للسلة"
                    >
                      →
                    </button>
                    <div>
                      <h3 className={`text-base sm:text-lg font-black leading-tight ${isDarkMode ? 'text-white' : 'text-stone-900'}`}>معلومات التوصيل والطلب</h3>
                      <p className="text-[11px] text-stone-400">سنقوم بتجهيز نباتاتك والتواصل معك لتأكيد التوصيل</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsCheckoutOpen(false)} 
                    className="p-2 text-stone-400 hover:text-white text-lg leading-none"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 sm:p-6 overflow-y-auto space-y-4">
                  <form onSubmit={handleOrderSubmit} className="space-y-3.5">
                    <div>
                      <label className={`block text-xs font-bold mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>الاسم الكامل *</label>
                      <input 
                        required 
                        type="text" 
                        placeholder="مثال: أحمد خليل" 
                        value={customer.name} 
                        onChange={e => setCustomer({...customer, name: e.target.value})}
                        className={`w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-[#C85A32] ${isDarkMode ? 'bg-stone-800/80 border-stone-700 text-white placeholder-stone-500' : 'bg-stone-50 border-stone-200 text-stone-900'}`}
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className={`block text-xs font-bold mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>رقم الهاتف للتواصل *</label>
                        <input 
                          required 
                          type="tel" 
                          placeholder="078XXXXXXX" 
                          value={customer.phone} 
                          onChange={e => setCustomer({...customer, phone: e.target.value})}
                          className={`w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-[#C85A32] ${isDarkMode ? 'bg-stone-800/80 border-stone-700 text-white placeholder-stone-500' : 'bg-stone-50 border-stone-200 text-stone-900'}`}
                        />
                      </div>
                      <div>
                        <label className={`block text-xs font-bold mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>البريد الإلكتروني (اختياري)</label>
                        <input 
                          type="email" 
                          placeholder="email@domain.com" 
                          value={customer.email} 
                          onChange={e => setCustomer({...customer, email: e.target.value})}
                          className={`w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-[#C85A32] ${isDarkMode ? 'bg-stone-800/80 border-stone-700 text-white placeholder-stone-500' : 'bg-stone-50 border-stone-200 text-stone-900'}`}
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className={`block text-xs font-bold mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>المدينة / المحافظة *</label>
                        <input 
                          required 
                          type="text" 
                          placeholder="عَمّان، إربد، الزرقاء..." 
                          value={customer.city} 
                          onChange={e => setCustomer({...customer, city: e.target.value})}
                          className={`w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-[#C85A32] ${isDarkMode ? 'bg-stone-800/80 border-stone-700 text-white placeholder-stone-500' : 'bg-stone-50 border-stone-200 text-stone-900'}`}
                        />
                      </div>
                      <div>
                        <label className={`block text-xs font-bold mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>الحي / المنطقة *</label>
                        <input 
                          required 
                          type="text" 
                          placeholder="مثال: الجبيهة، عبدون..." 
                          value={customer.district} 
                          onChange={e => setCustomer({...customer, district: e.target.value})}
                          className={`w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-[#C85A32] ${isDarkMode ? 'bg-stone-800/80 border-stone-700 text-white placeholder-stone-500' : 'bg-stone-50 border-stone-200 text-stone-900'}`}
                        />
                      </div>
                    </div>

                    <div>
                      <label className={`block text-xs font-bold mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>الشارع وأقرب معلم *</label>
                      <textarea 
                        required 
                        rows="2" 
                        placeholder="اسم الشارع، رقم البناية أو بجانب معلم معروف..." 
                        value={customer.street} 
                        onChange={e => setCustomer({...customer, street: e.target.value})}
                        className={`w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-[#C85A32] ${isDarkMode ? 'bg-stone-800/80 border-stone-700 text-white placeholder-stone-500' : 'bg-stone-50 border-stone-200 text-stone-900'}`}
                      ></textarea>
                    </div>

                    <div className={`p-3.5 rounded-2xl border text-xs space-y-1.5 ${isDarkMode ? 'bg-stone-800/50 border-stone-700 text-stone-300' : 'bg-[#FAF7F0] border-stone-200 text-stone-600'}`}>
                      <div className="flex justify-between">
                        <span>إجمالي الأصناف ({totalItems}):</span>
                        <span className="font-bold">{subtotal.toFixed(2)} د.أ</span>
                      </div>
                      <div className="flex justify-between">
                        <span>توصيل لباب بيتك:</span>
                        <span className="font-bold">2.00 د.أ</span>
                      </div>
                      <div className={`flex justify-between text-sm font-black border-t pt-1.5 ${isDarkMode ? 'border-stone-700 text-white' : 'border-stone-200 text-stone-900'}`}>
                        <span>المبلغ المطلوب عند الاستلام:</span>
                        <span className="text-[#C85A32]">{grandTotal.toFixed(2)} د.أ</span>
                      </div>
                    </div>

                    <div className="pt-1 space-y-2">
                      <button 
                        disabled={isSubmitting}
                        type="submit" 
                        className="w-full bg-[#C85A32] hover:bg-[#A84520] text-white py-3.5 rounded-2xl font-bold text-sm shadow-lg flex items-center justify-center gap-2 transition"
                      >
                        <span>{isSubmitting ? "جاري إرسال الطلب..." : "تأكيد وإرسال الطلب 🌿"}</span>
                      </button>
                      
                      <button 
                        type="button"
                        onClick={() => { setIsCheckoutOpen(false); setIsCartOpen(true); }}
                        className="w-full text-center text-xs text-stone-400 hover:text-stone-200 py-1"
                      >
                        ← الرجوع لتعديل السلة
                      </button>
                    </div>
                  </form>
                </div>

              </div>
            </div>
          )}

          {/* نافذة التأكيد */}
          {orderSuccess && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-xs p-4">
              <div className={`w-full max-w-sm rounded-3xl p-7 text-center shadow-2xl border animate-in fade-in zoom-in duration-300 ${isDarkMode ? 'bg-[#1C1A17] border-stone-800' : 'bg-white border-stone-200'}`}>
                <div className="w-16 h-16 bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 font-bold">
                  ✓
                </div>
                <h3 className={`text-xl font-black mb-2 ${isDarkMode ? 'text-white' : 'text-stone-900'}`}>تم استلام طلبك بنجاح! 🎉</h3>
                <p className={`text-xs leading-relaxed mb-6 ${isDarkMode ? 'text-stone-300' : 'text-stone-600'}`}>
                  شكراً لثقتك بمتجر <strong className="text-[#C85A32]">شتلة وصَبّارة</strong>. تم استلام تفاصيل طلبك وعنوانك بنجاح، وسنقوم بالتواصل معك قريباً لتأكيد موعد التوصيل 🌿
                </p>
                <button 
                  onClick={() => setOrderSuccess(false)}
                  className="w-full bg-[#C85A32] hover:bg-[#A84520] text-white py-3 rounded-xl font-bold text-xs transition shadow-md"
                >
                  العودة للمتجر
                </button>
              </div>
            </div>
          )}

          <footer className="bg-stone-950 text-stone-300 py-12 border-t border-stone-800">
            <div className="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-right">
              <div>
                <span className="text-2xl font-black text-white flex items-center justify-center md:justify-start gap-2">
                  🪴 شتلة وصَبّارة
                </span>
                <p className="text-stone-400 text-xs mt-2 max-w-sm leading-relaxed">
                  "نجمع لك بين نضارة الشتلات الطبيعية وصمود الصبار الهادئ، لنصنع لمساحتك رونقاً خاصاً."
                </p>
              </div>
              <div className="text-xs text-stone-500">
                <p>جميع الحقوق محفوظة © متجر شتلة وصَبّارة</p>
                <p className="mt-1">صُنع بحب وإتقان من الهاتف مباشرة 📱</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
